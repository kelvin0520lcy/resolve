name: Deployed smoke

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Render deployment URL
        required: true
        default: https://resolve-asbp.onrender.com
        type: string

permissions:
  contents: read

jobs:
  verify-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Verify deployed commit and public routes
        env:
          PLAYWRIGHT_BASE_URL: ${{ inputs.base_url }}
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
        run: npm run test:e2e:deployed
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deployed-smoke-failure-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
