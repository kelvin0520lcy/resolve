name: Guitar visual snapshots

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  pixel-comparison:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble@sha256:baed2032d533817f3dbe6425de795788430ba345e819a1201337009ba17c9d07
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build production app
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ""
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ""
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ""
          NEXT_PUBLIC_FIREBASE_APP_ID: ""
        run: npm run build
      - name: Compare pinned Guitar Studio snapshots
        run: npm run test:e2e:guitar-visual
      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: guitar-visual-diffs
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
